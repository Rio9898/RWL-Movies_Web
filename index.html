<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080A0F">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RWL Movies">
<title>RWL Movies</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/rwl-icon.png"><link rel="icon" href="assets/rwl-icon.png"><link rel="stylesheet" href="style.css"></head>
<body><div id="ambient" class="ambient"></div>
<header class="glass topbar"><button class="brand bare" data-route="home"><img src="assets/rwl-icon.png"><span>RWL Movies</span></button><div id="topTitle" class="topTitle">الرئيسية</div><div class="topActions"><button class="iconBtn" id="searchBtn">⌕</button><button class="iconBtn" id="settingsBtn">⚙</button></div></header>
<main id="view" class="view"></main><nav id="dock" class="glass dock"></nav>
<div class="overlay" id="searchOverlay"><div class="modal panel"><button class="circleClose" data-close="searchOverlay">×</button><h2>بحث RWL</h2><input id="searchInput" class="searchInput" placeholder="فيلم، مسلسل، ممثل…"><div id="searchGrid" class="mediaGrid"></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="modal panel"><button class="circleClose" data-close="settingsOverlay">×</button><div class="settingsHero"><img src="assets/rwl-icon.png"><div><h2>RWL Movies</h2><p>الإعدادات</p></div></div><div id="settingsContent"></div></div></div>
<div class="overlay playerOverlay" id="playerOverlay"><div class="playerShell"><button class="circleClose playerClose" id="closePlayer">×</button><div class="playerTop"><div><b id="playerTitle">RWL Movies</b><small id="playerServer"></small></div><span id="playerLane" class="laneBadge">RWL DIRECT</span></div><div class="videoStage" id="videoStage"><video id="webPlayer" playsinline webkit-playsinline x-webkit-airplay="allow" preload="metadata"></video><div class="videoCenter"><button id="centerPlay" class="bigPlay">▶</button></div><button id="skipIntroBtn" class="skipBtn skipIntro">تخطي المقدمة</button><button id="skipCreditsBtn" class="skipBtn skipCredits">تخطي النهاية</button><div class="videoControls"><input id="seekBar" class="seekBar" type="range" min="0" max="1000" value="0"><div class="controlRow"><div class="controlGroup"><button id="playPauseBtn" class="controlBtn">▶</button><button id="back10Btn" class="controlBtn">↶10</button><button id="forward10Btn" class="controlBtn">10↷</button><span id="timeText">00:00 / 00:00</span></div><div class="controlGroup"><button id="subtitleBtn" class="controlBtn">CC</button><button id="subBackBtn" class="controlBtn">CC−</button><span id="subShiftLabel" class="subShiftLabel">0.00s</span><button id="subForwardBtn" class="controlBtn">CC+</button><button id="audioBtn" class="controlBtn">AUDIO</button><button id="speedBtn" class="controlBtn">1×</button><button id="qualityBtn" class="controlBtn">AUTO</button><button id="downloadBtn" class="controlBtn">⇩</button><button id="nativeFullBtn" class="controlBtn">▣</button><button id="fullScreenBtn" class="controlBtn">⛶</button></div></div></div><div id="floatingMenu" class="floatingMenu"></div></div></div></div>
<div id="toast" class="toast"></div><script src="app.js"></script></body></html>
