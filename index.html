<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <title>RWL Movies</title>
  <link rel="icon" href="assets/rwl-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="assets/rwl-icon.png" alt="RWL"><strong>RWL Movies</strong></div>
  <nav><button class="active">الرئيسية</button><button id="moviesNav">الأفلام</button><button id="tvNav">المسلسلات</button></nav>
  <div class="tools"><button id="searchBtn" title="بحث">⌕</button><button id="langBtn">AR</button></div>
</header>

<section class="hero" id="hero">
  <div class="heroShade"></div>
  <div class="heroContent">
    <div class="meta" id="heroMeta">RWL Movies Web</div>
    <h1 id="heroTitle">RWL MOVIES</h1>
    <p id="heroOverview">أفلام ومسلسلات RWL في مكان واحد.</p>
    <div class="actions"><button class="primary" id="heroDetails">ⓘ التفاصيل</button><button class="secondary" id="heroRefresh">↻ تحديث</button></div>
  </div>
</section>

<main>
  <section class="section"><div class="sectionHead"><h2 id="trendingTitle">الأكثر مشاهدة هذا الأسبوع</h2><span id="status">جاري الاتصال…</span></div><div class="row" id="trendingRow"></div></section>
  <section class="section"><div class="sectionHead"><h2 id="moviesTitle">أفلام شائعة</h2></div><div class="row" id="moviesRow"></div></section>
  <section class="section"><div class="sectionHead"><h2 id="tvTitle">مسلسلات شائعة</h2></div><div class="row" id="tvRow"></div></section>
</main>

<div class="overlay" id="detailsOverlay">
  <div class="modal detail"><button class="close" data-close="detailsOverlay">×</button><div class="detailBackdrop" id="detailBackdrop"></div><div class="detailBody">
    <div class="meta" id="detailMeta"></div><h2 id="detailTitle"></h2><p id="detailOverview"></p>
    <div class="episodePicker" id="episodePicker" hidden>
      <label><span id="seasonLabel">الموسم</span><select id="seasonSelect"></select></label>
      <label><span id="episodeLabel">الحلقة</span><select id="episodeSelect"></select></label>
      <button class="secondary" id="reloadSources">تحديث السيرفرات</button>
    </div>
    <h3 id="sourcesTitle">المصادر</h3>
    <div class="sourcesStatus" id="sourcesStatus"></div>
    <div class="sourceLane" id="directLane" hidden><h4>RWL DIRECT</h4><div class="sources" id="directSources"></div></div>
    <div class="sourceLane" id="p2pLane" hidden><h4>RWL P2P</h4><div class="sources" id="p2pSources"></div></div>
  </div></div>
</div>

<div class="overlay" id="playerOverlay">
  <div class="modal playerModal">
    <button class="close" id="closePlayer">×</button>
    <div class="playerTop"><strong id="playerTitle">RWL Movies</strong><span id="playerServer"></span></div>
    <video id="webPlayer" controls playsinline preload="metadata"></video>
    <div class="playerTools"><div id="qualityButtons" class="qualityButtons"></div><button class="secondary" id="fullScreenBtn">⛶ ملء الشاشة</button></div>
  </div>
</div>

<div class="overlay" id="searchOverlay">
  <div class="modal search"><button class="close" data-close="searchOverlay">×</button><h2>بحث</h2><input id="searchInput" placeholder="اكتب اسم فيلم أو مسلسل…" autocomplete="off"><div class="searchGrid" id="searchGrid"></div></div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
